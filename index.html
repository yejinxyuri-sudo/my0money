<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY MONEY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#171717;--muted:#777;--line:#e9e9e9;--soft:#f7f7f7;--accent:#202020;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:#fafafa;color:var(--ink);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding:34px 24px 90px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.08em}.muted{color:var(--muted);font-size:13px}button,input,select{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.btn.dark{background:#171717;color:#fff;border-color:#171717}.btn.danger{color:var(--danger)}.month{display:flex;justify-content:center;align-items:center;gap:18px;margin:36px 0 20px}.month button{border:0;background:none;font-size:20px;cursor:pointer}.hero{padding:28px 0;border-bottom:1px solid var(--line)}.hero h1{font-size:38px;margin:8px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card{background:var(--soft);border-radius:16px;padding:16px}.card b{display:block;margin-top:8px;font-size:18px}.section{padding:25px 0;border-bottom:1px solid var(--line)}.section h2{font-size:16px;margin:0 0 16px}.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#222}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f1f1}.row:last-child{border:0}.tx-main{font-weight:600}.tx-meta{font-size:12px;color:var(--muted);margin-top:4px}.income{color:#19704b}.expense{color:#222}.empty{text-align:center;color:var(--muted);padding:28px 0}.fab{position:fixed;right:max(24px,calc((100vw - 720px)/2 + 24px));bottom:24px;border:0;border-radius:999px;background:#171717;color:#fff;padding:15px 20px;box-shadow:0 8px 24px #0002;cursor:pointer}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);border-radius:24px 24px 0 0;padding:24px;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.login{max-width:380px;margin:100px auto}.login h1{font-size:34px}.login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:6px 0}.login .btn{width:100%;margin-top:8px}.error{color:var(--danger);font-size:13px;margin-top:10px}@media(max-width:560px){.wrap{padding:25px 18px 90px}.cards{grid-template-columns:1fr}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="sheet"><div class="top"><b id="formTitle">내역 추가</b><button class="btn" onclick="closeModal()">닫기</button></div><form id="txForm">
<input type="hidden" id="txId"><div class="grid"><div class="field"><label>구분</label><select id="type"><option value="expense">지출</option><option value="income">수입</option></select></div><div class="field"><label>날짜</label><input id="date" type="date" required></div></div>
<div class="field"><label>금액</label><input id="amount" type="number" min="0" step="1" required placeholder="12000"></div>
<div class="grid"><div class="field"><label>카테고리</label><select id="category"><option>식비</option><option>교통</option><option>쇼핑</option><option>문화·덕질</option><option>생활</option><option>고정비</option><option>급여</option><option>기타</option></select></div><div class="field"><label>결제수단</label><select id="payment"><option>카드</option><option>현금</option><option>계좌이체</option><option>기타</option></select></div></div>
<div class="field"><label>내용</label><input id="title" required placeholder="점심"></div><div class="field"><label>메모</label><input id="memo" placeholder="선택사항"></div>
<div class="actions"><button type="button" id="deleteBtn" class="btn danger" style="display:none">삭제</button><button class="btn dark">저장</button></div></form></div></div>
<script>
const SUPABASE_URL='https://vumhhknvxblbpzliayqe.supabase.co';
const SUPABASE_KEY='sb_publishable_mk_fADX38m_jufpS_EIC8w_TKV19PgQ';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, transactions=[], cursor=new Date();
const won=n=>new Intl.NumberFormat('ko-KR').format(Number(n||0))+'원';
const ym=()=>({y:cursor.getFullYear(),m:cursor.getMonth()+1});
async function init(){const {data}=await sb.auth.getSession();user=data.session?.user||null; user?await load():renderLogin()}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="brand">MY MONEY</div><h1>나만의 가계부</h1><p class="muted">Supabase에서 만든 계정으로 로그인하세요.</p><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button class="btn dark" onclick="login()">로그인</button><div id="loginErr" class="error"></div></div>`}
async function login(){const email=document.getElementById('email').value,p=document.getElementById('pw').value;const {data,error}=await sb.auth.signInWithPassword({email,password:p});if(error){document.getElementById('loginErr').textContent='로그인 실패: '+error.message;return}user=data.user;await load()}
async function logout(){await sb.auth.signOut();user=null;renderLogin()}
async function load(){const {y,m}=ym();const start=`${y}-${String(m).padStart(2,'0')}-01`;const end=new Date(y,m,1).toISOString().slice(0,10);const {data,error}=await sb.from('transactions').select('*').gte('date',start).lt('date',end).order('date',{ascending:false}).order('created_at',{ascending:false});transactions=data||[];if(error)console.error(error);render()}
function render(){const {y,m}=ym();let income=0,expense=0;const cats={};transactions.forEach(t=>{if(t.type==='income')income+=+t.amount;else{expense+=+t.amount;cats[t.category||'기타']=(cats[t.category||'기타']||0)+ +t.amount}});const remain=income-expense;const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${k}</span><b>${won(v)}</b></div>`).join('')||'<div class="empty">아직 지출이 없어요.</div>';const txRows=transactions.map(t=>`<div class="row" onclick="editTx('${t.id}')" style="cursor:pointer"><div><div class="tx-main">${esc(t.title||'내역')}</div><div class="tx-meta">${t.date} · ${esc(t.category||'기타')} · ${esc(t.payment_method||'')}</div></div><b class="${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'-'}${won(t.amount)}</b></div>`).join('')||'<div class="empty">＋ 버튼으로 첫 내역을 추가해보세요.</div>';
document.getElementById('app').innerHTML=`<div class="top"><div class="brand">MY MONEY</div><button class="btn" onclick="logout()">로그아웃</button></div><div class="month"><button onclick="move(-1)">‹</button><b>${y}년 ${m}월</b><button onclick="move(1)">›</button></div><section class="hero"><span class="muted">이번 달 지출</span><h1>₩ ${new Intl.NumberFormat('ko-KR').format(expense)}</h1><span class="muted">기록한 내역을 기준으로 자동 계산돼요.</span></section><div class="cards"><div class="card"><span class="muted">수입</span><b>${won(income)}</b></div><div class="card"><span class="muted">지출</span><b>${won(expense)}</b></div><div class="card"><span class="muted">잔액</span><b>${won(remain)}</b></div></div><section class="section"><h2>지출 분석</h2>${catRows}</section><section class="section"><h2>이번 달 내역</h2>${txRows}</section><button class="fab" onclick="newTx()">＋ 내역 추가</button>`}
function move(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);load()}
function newTx(){document.getElementById('txForm').reset();document.getElementById('txId').value='';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('deleteBtn').style.display='none';document.getElementById('formTitle').textContent='내역 추가';openModal()}
function editTx(id){const t=transactions.find(x=>String(x.id)===String(id));if(!t)return;document.getElementById('txId').value=t.id;document.getElementById('type').value=t.type;document.getElementById('date').value=t.date;document.getElementById('amount').value=t.amount;document.getElementById('category').value=t.category||'기타';document.getElementById('payment').value=t.payment_method||'기타';document.getElementById('title').value=t.title||'';document.getElementById('memo').value=t.memo||'';document.getElementById('deleteBtn').style.display='block';document.getElementById('formTitle').textContent='내역 수정';openModal()}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('txForm').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('txId').value;const payload={user_id:user.id,date:document.getElementById('date').value,type:document.getElementById('type').value,amount:+document.getElementById('amount').value,category:document.getElementById('category').value,title:document.getElementById('title').value,payment_method:document.getElementById('payment').value,memo:document.getElementById('memo').value};const q=id?sb.from('transactions').update(payload).eq('id',id):sb.from('transactions').insert(payload);const {error}=await q;if(error){alert(error.message);return}closeModal();await load()});
document.getElementById('deleteBtn').addEventListener('click',async()=>{const id=document.getElementById('txId').value;if(!id||!confirm('이 내역을 삭제할까요?'))return;const {error}=await sb.from('transactions').delete().eq('id',id);if(error){alert(error.message);return}closeModal();await load()});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}init();
</script></body></html>
