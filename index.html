<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>MY MONEY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#171717;--muted:#777;--line:#ececec;--soft:#f7f7f7;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:var(--ink);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#fff;padding:30px 24px 110px}.top,.between{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:.09em}.muted{color:var(--muted);font-size:13px}button,input,select{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.btn.dark{background:#171717;color:#fff;border-color:#171717}.btn.danger{color:var(--danger)}.month{display:flex;justify-content:center;align-items:center;gap:18px;margin:28px 0 16px}.month button{border:0;background:none;font-size:20px;cursor:pointer}.hero{padding:24px 0 26px;border-bottom:1px solid var(--line)}.hero h1{font-size:38px;margin:8px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.card{background:var(--soft);border-radius:16px;padding:16px}.card b{display:block;margin-top:8px;font-size:18px}.section{padding:24px 0;border-bottom:1px solid var(--line)}.section h2{font-size:16px;margin:0 0 16px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f1f1}.row:last-child{border:0}.tx-main{font-weight:650}.tx-meta{font-size:12px;color:var(--muted);margin-top:4px}.income{color:#19704b}.expense{color:#222}.empty{text-align:center;color:var(--muted);padding:28px 0}.barline{margin:14px 0}.barhead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#222;border-radius:99px}.fab{position:fixed;right:max(24px,calc((100vw - 760px)/2 + 24px));bottom:82px;border:0;border-radius:999px;background:#171717;color:#fff;padding:15px 20px;box-shadow:0 8px 24px #0002;cursor:pointer;z-index:5}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:64px;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:4}.tabs button{border:0;background:none;color:#999;font-weight:650}.tabs button.active{color:#171717}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);border-radius:16px;padding:16px}.stat strong{display:block;font-size:20px;margin-top:7px}.chartbox{height:250px}.top5num{width:28px;color:#999;font-size:13px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:min(760px,100%);border-radius:24px 24px 0 0;padding:24px;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.login{max-width:380px;margin:100px auto}.login h1{font-size:34px}.login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:6px 0}.login .btn{width:100%;margin-top:8px}.error{color:var(--danger);font-size:13px;margin-top:10px}.click{cursor:pointer}.detailTitle{font-size:22px;margin:6px 0 18px}@media(max-width:560px){.wrap{padding:24px 18px 110px}.cards{grid-template-columns:1fr}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.chartbox{height:220px}}
</style></head><body><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="sheet"><div class="top"><b id="formTitle">내역 추가</b><button class="btn" onclick="closeModal()">닫기</button></div><form id="txForm"><input type="hidden" id="txId"><div class="grid"><div class="field"><label>구분</label><select id="type"><option value="expense">지출</option><option value="income">수입</option></select></div><div class="field"><label>날짜</label><input id="date" type="date" required></div></div><div class="field"><label>금액</label><input id="amount" type="number" min="0" step="1" required placeholder="12000"></div><div class="grid"><div class="field"><label>카테고리</label><select id="category"><option>식비</option><option>교통</option><option>쇼핑</option><option>문화·덕질</option><option>생활</option><option>고정비</option><option>급여</option><option>기타</option></select></div><div class="field"><label>결제수단</label><select id="payment"><option>카드</option><option>현금</option><option>계좌이체</option><option>기타</option></select></div></div><div class="field"><label>내용</label><input id="title" required placeholder="점심"></div><div class="field"><label>메모</label><input id="memo" placeholder="선택사항"></div><div class="actions"><button type="button" id="deleteBtn" class="btn danger" style="display:none">삭제</button><button class="btn dark">저장</button></div></form></div></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="top"><div><div class="muted">카테고리 상세</div><div class="detailTitle" id="detailTitle"></div></div><button class="btn" onclick="document.getElementById('detailModal').classList.remove('open')">닫기</button></div><div id="detailRows"></div></div></div>
<script>
const SUPABASE_URL='https://vumhhknvxblbpzliayqe.supabase.co',SUPABASE_KEY='sb_publishable_mk_fADX38m_jufpS_EIC8w_TKV19PgQ';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,transactions=[],history=[],cursor=new Date(),tab='home',trendChart=null,catChart=null;
const won=n=>new Intl.NumberFormat('ko-KR').format(Number(n||0))+'원', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const ym=()=>({y:cursor.getFullYear(),m:cursor.getMonth()+1}), monthStart=(y,m)=>`${y}-${String(m).padStart(2,'0')}-01`;
async function init(){const {data}=await sb.auth.getSession();user=data.session?.user||null;if(user)await load();else renderLogin();sb.auth.onAuthStateChange(async(_,session)=>{if(session?.user&&!user){user=session.user;await load()}})}
function renderLogin(){app.innerHTML=`<div class="login"><div class="brand">MY MONEY</div><h1>나만의 가계부</h1><p class="muted">이 기기에서는 한 번 로그인하면 로그인 상태가 유지돼요.</p><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button class="btn dark" onclick="login()">로그인</button><div id="loginErr" class="error"></div></div>`}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error){loginErr.textContent='로그인 실패: '+error.message;return}user=data.user;await load()}
async function logout(){await sb.auth.signOut();user=null;renderLogin()}
async function load(){const {y,m}=ym(),start=monthStart(y,m),end=new Date(y,m,1).toISOString().slice(0,10),histStart=new Date(y,m-6,1).toISOString().slice(0,10);let a=await sb.from('transactions').select('*').gte('date',start).lt('date',end).order('date',{ascending:false}).order('created_at',{ascending:false});let b=await sb.from('transactions').select('*').gte('date',histStart).lt('date',end).order('date',{ascending:true});transactions=a.data||[];history=b.data||[];if(a.error||b.error)console.error(a.error||b.error);render()}
function shell(content){return `<div class="top"><div class="brand">MY MONEY</div><button class="btn" onclick="logout()">로그아웃</button></div><div class="month"><button onclick="move(-1)">‹</button><b>${ym().y}년 ${ym().m}월</b><button onclick="move(1)">›</button></div>${content}<nav class="tabs"><button class="${tab==='home'?'active':''}" onclick="setTab('home')">홈</button><button class="${tab==='list'?'active':''}" onclick="setTab('list')">내역</button><button class="${tab==='stats'?'active':''}" onclick="setTab('stats')">통계</button></nav>`}
function sums(arr=transactions){let income=0,expense=0,cats={};arr.forEach(t=>{if(t.type==='income')income+=+t.amount;else{expense+=+t.amount;cats[t.category||'기타']=(cats[t.category||'기타']||0)+ +t.amount}});return{income,expense,cats}}
function render(){if(tab==='home')renderHome();if(tab==='list')renderList();if(tab==='stats')renderStats()}
function renderHome(){const {income,expense,cats}=sums(),remain=income-expense,sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=sorted[0]?.[1]||1;const catRows=sorted.slice(0,5).map(([k,v])=>`<div class="barline click" onclick="showCategory('${esc(k)}')"><div class="barhead"><span>${esc(k)}</span><b>${won(v)}</b></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join('')||'<div class="empty">아직 지출이 없어요.</div>';app.innerHTML=shell(`<section class="hero"><span class="muted">이번 달 지출</span><h1>₩ ${new Intl.NumberFormat('ko-KR').format(expense)}</h1><span class="muted">기록한 내역을 기준으로 자동 계산돼요.</span></section><div class="cards"><div class="card"><span class="muted">수입</span><b>${won(income)}</b></div><div class="card"><span class="muted">지출</span><b>${won(expense)}</b></div><div class="card"><span class="muted">잔액</span><b>${won(remain)}</b></div></div><section class="section"><div class="between"><h2>많이 쓴 곳</h2><button class="btn" onclick="setTab('stats')">통계 보기</button></div>${catRows}</section><button class="fab" onclick="newTx()">＋ 내역 추가</button>`)}
function txRows(arr){return arr.map(t=>`<div class="row click" onclick="editTx('${t.id}')"><div><div class="tx-main">${esc(t.title||'내역')}</div><div class="tx-meta">${t.date} · ${esc(t.category||'기타')} · ${esc(t.payment_method||'')}</div></div><b class="${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'-'}${won(t.amount)}</b></div>`).join('')||'<div class="empty">＋ 버튼으로 첫 내역을 추가해보세요.</div>'}
function renderList(){app.innerHTML=shell(`<section class="section"><h2>이번 달 전체 내역</h2>${txRows(transactions)}</section><button class="fab" onclick="newTx()">＋ 내역 추가</button>`)}
function renderStats(){const cur=sums(),{y,m}=ym(),prevDate=new Date(y,m-2,1),py=prevDate.getFullYear(),pm=prevDate.getMonth()+1,prevArr=history.filter(t=>t.date>=monthStart(py,pm)&&t.date<monthStart(y,m)),prev=sums(prevArr),diff=cur.expense-prev.expense,days=new Date(y,m,0).getDate(),avg=Math.round(cur.expense/days),sorted=Object.entries(cur.cats).sort((a,b)=>b[1]-a[1]),topCat=sorted[0]?.[0]||'-',top5=transactions.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5);app.innerHTML=shell(`<div class="statgrid"><div class="stat"><span class="muted">지난달 대비</span><strong>${diff>=0?'+':'-'}${won(Math.abs(diff))}</strong></div><div class="stat"><span class="muted">하루 평균</span><strong>${won(avg)}</strong></div><div class="stat"><span class="muted">가장 많이 쓴 분야</span><strong>${esc(topCat)}</strong></div><div class="stat"><span class="muted">이번 달 총지출</span><strong>${won(cur.expense)}</strong></div></div><section class="section"><h2>카테고리별 소비</h2><div class="chartbox"><canvas id="catChart"></canvas></div></section><section class="section"><h2>최근 6개월 지출 추이</h2><div class="chartbox"><canvas id="trendChart"></canvas></div></section><section class="section"><h2>큰 지출 TOP 5</h2>${top5.map((t,i)=>`<div class="row click" onclick="editTx('${t.id}')"><div style="display:flex;align-items:center"><span class="top5num">${i+1}</span><div><div class="tx-main">${esc(t.title)}</div><div class="tx-meta">${t.date} · ${esc(t.category)}</div></div></div><b>${won(t.amount)}</b></div>`).join('')||'<div class="empty">아직 지출이 없어요.</div>'}</section>`);setTimeout(()=>drawCharts(sorted),0)}
function drawCharts(sorted){if(catChart)catChart.destroy();if(trendChart)trendChart.destroy();const labels=sorted.map(x=>x[0]),vals=sorted.map(x=>x[1]);catChart=new Chart(document.getElementById('catChart'),{type:'doughnut',data:{labels,datasets:[{data:vals}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>`${c.label}: ${won(c.raw)}`}}},cutout:'68%'}});const {y,m}=ym(),months=[];for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),yy=d.getFullYear(),mm=d.getMonth()+1,start=monthStart(yy,mm),end=new Date(yy,mm,1).toISOString().slice(0,10),sum=history.filter(t=>t.type==='expense'&&t.date>=start&&t.date<end).reduce((a,t)=>a+(+t.amount),0);months.push({label:`${mm}월`,sum})}trendChart=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:months.map(x=>x.label),datasets:[{label:'지출',data:months.map(x=>x.sum),tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>won(c.raw)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>new Intl.NumberFormat('ko-KR',{notation:'compact'}).format(v)}}}}})}
function showCategory(cat){const rows=transactions.filter(t=>t.type==='expense'&&t.category===cat);detailTitle.textContent=`${cat} · ${won(rows.reduce((a,t)=>a+(+t.amount),0))}`;detailRows.innerHTML=txRows(rows);detailModal.classList.add('open')}
function setTab(t){tab=t;render()}function move(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);load()}
function newTx(){txForm.reset();txId.value='';date.value=new Date().toLocaleDateString('en-CA');deleteBtn.style.display='none';formTitle.textContent='내역 추가';openModal()}
function editTx(id){const t=[...transactions,...history].find(x=>String(x.id)===String(id));if(!t)return;txId.value=t.id;type.value=t.type;date.value=t.date;amount.value=t.amount;category.value=t.category||'기타';payment.value=t.payment_method||'기타';title.value=t.title||'';memo.value=t.memo||'';deleteBtn.style.display='block';formTitle.textContent='내역 수정';detailModal.classList.remove('open');openModal()}
function openModal(){modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
txForm.addEventListener('submit',async e=>{e.preventDefault();const id=txId.value,payload={user_id:user.id,date:date.value,type:type.value,amount:+amount.value,category:category.value,title:title.value,payment_method:payment.value,memo:memo.value};const {error}=await(id?sb.from('transactions').update(payload).eq('id',id):sb.from('transactions').insert(payload));if(error)return alert(error.message);closeModal();await load()});deleteBtn.addEventListener('click',async()=>{const id=txId.value;if(!id||!confirm('이 내역을 삭제할까요?'))return;const {error}=await sb.from('transactions').delete().eq('id',id);if(error)return alert(error.message);closeModal();await load()});init();
</script></body></html>
